appId: com.datapad.workbench
productName: Datapad Workbench
copyright: Copyright © Datapad B.V.
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  # Run by the Claude adapter's utility process. It stays in the asar, where the integrity check covers it.
  - src/main/claude-acp-host.mjs
  - resources/icon.png
  - resources/trayTemplate*.png
  - package.json
# The agents start these as their own processes, so they must be real files.
# The Dock and menu bar icons are loaded by path, which needs a real file as well.
# An unpacked module cannot import from inside the asar, so the Claude adapter's
# dependencies (zod, diff) are unpacked with it.
asarUnpack:
  - resources/icon.png
  - resources/trayTemplate*.png
  - node_modules/@agentclientprotocol/**
  - node_modules/@anthropic-ai/**
  - node_modules/zod/**
  - node_modules/diff/**
# Electron's fuses, set in the binary before signing. Off: running the app as plain Node
# (ELECTRON_RUN_AS_NODE), NODE_OPTIONS and --inspect, which would let any program on this Mac run
# its own code as Datapad Workbench. On: cookie encryption, and checks that the app's code is the
# signed app.asar. The app loads its page from file://, so file: keeps its extra privileges.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: true
artifactName: Datapad-Workbench-${version}-${os}-${arch}.${ext}
publish:
  provider: github
  owner: Datapad-nl
  repo: DatapadWorkbench
  # The three platform jobs upload into one draft. The release workflow publishes it once all three are up.
  releaseType: draft

mac:
  category: public.app-category.developer-tools
  icon: icon.icns
  hardenedRuntime: true
  entitlements: resources/mac/entitlements.mac.plist
  entitlementsInherit: resources/mac/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Datapad Workbench listens on this Mac so you can talk to your agent in conversation mode.
    NSAudioCaptureUsageDescription: Datapad Workbench listens on this Mac so you can talk to your agent in conversation mode.
  # The Claude Code binary ships per platform, so each architecture is built on its own runner.
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]

win:
  icon: icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  icon: icon.png
  category: Development
  target:
    - target: AppImage
      arch: [x64]
