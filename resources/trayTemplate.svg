<svg xmlns="http://www.w3.org/2000/svg" viewBox="90 90 900 900">
  <defs>
    <!-- The badge with a gap around it is cut out of both layers. -->
    <mask id="layers" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <rect x="520" y="520" width="490" height="490" rx="130" fill="#000"/>
    </mask>
    <!-- The bottom layer shows below the top one, with a gap between them. -->
    <mask id="bottom" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <polygon points="175,370 475,165 775,370 475,575" fill="#000" stroke="#000" stroke-width="210" stroke-linejoin="round"/>
      <rect x="560" y="0" width="464" height="600" fill="#000"/>
    </mask>
    <mask id="badge" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <polyline points="648,690 716,858 768,728 820,858 888,690" fill="none" stroke="#000" stroke-width="58" stroke-linejoin="miter" stroke-linecap="butt"/>
    </mask>
  </defs>
  <g mask="url(#layers)">
    <polygon points="175,370 475,165 775,370 475,575" fill="#000" stroke="#000" stroke-width="110" stroke-linejoin="round"/>
    <g mask="url(#bottom)">
      <polygon points="175,570 475,365 775,570 475,775" fill="#000" stroke="#000" stroke-width="110" stroke-linejoin="round"/>
    </g>
  </g>
  <rect x="573" y="573" width="390" height="390" rx="90" fill="#000" mask="url(#badge)"/>
</svg>
